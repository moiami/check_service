name: "moiami-check"
services:
  check:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/check_db"
      COMMENTS_SERVICE_URL: "http://comments-service:8007"
      RESOURCE_SERVICE_URL: "http://resource:8000"
      LLM_URL: "http://ollama:11434/api/generate"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started


  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data2:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2:7b"]
    volumes:
      - ollama:/root/.ollama
    restart: "no"

volumes:
  postgres_data2:
  static_files:
  ollama:
