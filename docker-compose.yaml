name: 'moimai-check'
services:
  postgres-check:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres

  check:
    build: .
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      - postgres-check
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:root@postgres-check:5432/postgres